version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: corp_bot_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: corp_bot_db
    ports:
      - "5433:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data
    # Поддержка архитектуры ARM64 (важно для Mac M1)
    platform: linux/arm64

